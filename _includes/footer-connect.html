{% assign current_lang = page.lang | default: 'en' %}
{% assign t = site.data.site-text[current_lang] | default: site.data.site-text.en %}
<div class="footer-connect">
  <h2>{{ t.footer.connect_title }}</h2>
  <p class="footer-connect-line">{{ t.footer.connect_prefix }}</p>
  <a href="{{ footer_home | append: 'resume/' | relative_url }}">{{ t.footer.resume_label }}</a>
</div>
