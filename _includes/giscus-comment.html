{% if site.giscus.repository and site.giscus.hostname %}

<script>
  const giscus = document.createElement("script");
  giscus.src = "https://{{ site.giscus.hostname }}/client.js";
  giscus.setAttribute("data-repo", "{{ site.giscus.repository }}");
  giscus.setAttribute("data-repo-id", "{{ site.giscus.repository-id }}");
  giscus.setAttribute("data-category", "{{ site.giscus.category }}");
  giscus.setAttribute("data-category-id", "{{ site.giscus.category-id }}");
  giscus.setAttribute("data-mapping", "{{ site.giscus.mapping }}");
  giscus.setAttribute("data-reactions-enabled", "{{ site.giscus.reactions-enabled }}");
  giscus.setAttribute("data-emit-metadata", "{{ site.giscus.emit-metadata }}");
  giscus.setAttribute("data-theme", document.body.getAttribute("data-theme") || "{{ site.giscus.theme }}");
  giscus.crossOrigin = "anonymous";
  giscus.async = true;
  document.currentScript.after(giscus);
</script>

{% endif %}
