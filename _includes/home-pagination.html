<nav class="home-pagination" aria-label="{{ t.home.pagination }}" data-per-page="{{ site.home_posts_per_page }}" data-page-status="{{ t.home.page_status }}" hidden>
  <a class="home-pagination-previous" rel="prev">← {{ t.home.previous_page }}</a>
  <span class="home-pagination-status" aria-current="page"></span>
  <a class="home-pagination-next" rel="next">{{ t.home.next_page }} →</a>
</nav>
